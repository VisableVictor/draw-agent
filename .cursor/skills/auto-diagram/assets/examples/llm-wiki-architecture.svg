    <rect class="tool-top" x="1360" y="604" width="368" height="14" rx="18" ry="18"/>
    <text class="ad-node-title" x="1544" y="638" text-anchor="middle">Optional Search and CLI</text>
    <text class="ad-node-body" x="1544" y="660" text-anchor="middle">
      <tspan x="1544" dy="0">At small scale the</tspan>
      <tspan x="1544" dy="18">index is enough.</tspan>
      <tspan x="1544" dy="18">qmd helps at larger scale.</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="outputs" data-group-id="usage-loop" data-pad-x="20" data-pad-top="12" data-pad-bottom="8">
