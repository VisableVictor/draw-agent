      <tspan x="852" dy="0">topics, claims,</tspan>
      <tspan x="852" dy="17">explanations</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="entities" data-group-id="wiki-shell" data-pad-x="18" data-pad-top="12" data-pad-bottom="10">
    <rect class="ad-node-box stage-box" x="994" y="494" width="196" height="88" rx="16" ry="16"/>
    <rect class="wiki-top" x="994" y="494" width="196" height="12" rx="16" ry="16"/>
    <text class="ad-node-title" x="1092" y="528" text-anchor="middle" font-size="16">Entity Pages</text>
    <text class="ad-node-body" x="1092" y="551" text-anchor="middle" font-size="12">
      <tspan x="1092" dy="0">people, tools,</tspan>
      <tspan x="1092" dy="17">systems, projects</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="sources" data-group-id="wiki-shell" data-pad-x="18" data-pad-top="10" data-pad-bottom="8">
    <rect class="ad-node-box stage-box" x="634" y="614" width="196" height="80" rx="16" ry="16"/>
    <rect class="wiki-top" x="634" y="614" width="196" height="12" rx="16" ry="16"/>
    <text class="ad-node-title" x="732" y="646" text-anchor="middle" font-size="16">Source Summaries</text>
    <text class="ad-node-body" x="732" y="665" text-anchor="middle" font-size="12">
      <tspan x="732" dy="0">one page per source</tspan>
      <tspan x="732" dy="17">with traceability</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="comparisons" data-group-id="wiki-shell" data-pad-x="18" data-pad-top="10" data-pad-bottom="8">
