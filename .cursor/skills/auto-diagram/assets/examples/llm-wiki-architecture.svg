  <rect x="0" y="0" width="1840" height="1080" fill="url(#bg-grad)"/>

  <text class="ad-title" x="72" y="78">LLM Wiki: A Compiled Knowledge Architecture</text>
  <text class="ad-subtitle" x="72" y="108">Turn scattered sources into a persistent markdown wiki that the agent keeps updated, searchable, and explainable over time.</text>

  <g>
    <rect class="ad-note-box hero-box" x="1126" y="48" width="634" height="118" rx="24" ry="24"/>
    <text class="ad-note-title" x="1443" y="88" text-anchor="middle">Core Message</text>
    <text class="ad-note-body" x="1443" y="116" text-anchor="middle">
      <tspan x="1443" dy="0">This pattern does not re-discover truth from raw files on every question.</tspan>
      <tspan x="1443" dy="18">It compiles knowledge once into a maintained wiki, then keeps enriching it.</tspan>
    </text>
  </g>

  <g class="ad-stage" data-stage-id="main-stage">
    <rect class="stage-box ad-stage-box" x="52" y="188" width="1736" height="796" rx="28" ry="28"/>
  </g>
  <text class="ad-group-title" x="84" y="214">TECHNICAL STRUCTURE</text>

  <g class="ad-group" data-group-id="raw-sources">
    <rect class="ad-group-box group-box" x="76" y="236" width="304" height="620" rx="24" ry="24"/>
    <text class="ad-group-title" x="104" y="264">RAW SOURCES</text>
  </g>

  <g class="ad-group" data-group-id="wiki-core">
    <rect class="ad-group-box group-box" x="444" y="236" width="816" height="620" rx="24" ry="24"/>
    <text class="ad-group-title" x="472" y="264">COMPILED WIKI CORE</text>
  </g>

  <g class="ad-group" data-group-id="usage-loop">
    <rect class="ad-group-box group-box" x="1324" y="236" width="440" height="620" rx="24" ry="24"/>
    <text class="ad-group-title" x="1352" y="264">USER LOOP AND TOOLS</text>
  </g>

  <g class="ad-node" data-node-id="raw-articles" data-group-id="raw-sources" data-pad-x="22" data-pad-top="16" data-pad-bottom="16">
    <rect class="ad-node-box stage-box" x="104" y="322" width="248" height="104" rx="18" ry="18"/>
    <rect class="raw-top" x="104" y="322" width="248" height="14" rx="18" ry="18"/>
    <text class="ad-node-title" x="228" y="364" text-anchor="middle">Articles and Papers</text>
    <text class="ad-node-body" x="228" y="389" text-anchor="middle">
      <tspan x="228" dy="0">web clips, reports,</tspan>
      <tspan x="228" dy="18">notes from reading</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="raw-transcripts" data-group-id="raw-sources" data-pad-x="22" data-pad-top="12" data-pad-bottom="10">
    <rect class="ad-node-box stage-box" x="104" y="454" width="248" height="110" rx="18" ry="18"/>
    <rect class="raw-top" x="104" y="454" width="248" height="14" rx="18" ry="18"/>
    <text class="ad-node-title" x="228" y="490" text-anchor="middle" font-size="17">
      <tspan x="228" dy="0">Notes and</tspan>
      <tspan x="228" dy="18">Transcripts</tspan>
    </text>
    <text class="ad-node-body" x="228" y="521" text-anchor="middle">
      <tspan x="228" dy="0">meetings, calls,</tspan>
      <tspan x="228" dy="18">journals, project docs</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="raw-assets" data-group-id="raw-sources" data-pad-x="22" data-pad-top="12" data-pad-bottom="10">
    <rect class="ad-node-box stage-box" x="104" y="586" width="248" height="110" rx="18" ry="18"/>
    <rect class="raw-top" x="104" y="586" width="248" height="14" rx="18" ry="18"/>
    <text class="ad-node-title" x="228" y="622" text-anchor="middle" font-size="17">
      <tspan x="228" dy="0">Images and</tspan>
      <tspan x="228" dy="18">Data Files</tspan>
    </text>
    <text class="ad-node-body" x="228" y="653" text-anchor="middle">
      <tspan x="228" dy="0">screenshots, tables,</tspan>
      <tspan x="228" dy="18">assets and evidence</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="raw-truth" data-group-id="raw-sources" data-role="annotation" data-pad-x="22" data-pad-top="12" data-pad-bottom="10">
    <rect class="ad-note-box dark-note" x="104" y="728" width="248" height="106" rx="18" ry="18"/>
    <text class="ad-note-title" x="228" y="762" text-anchor="middle">Why Raw Matters</text>
    <text class="ad-note-body" x="228" y="784" text-anchor="middle">
      <tspan x="228" dy="0">Immutable source</tspan>
      <tspan x="228" dy="18">of truth. The agent</tspan>
      <tspan x="228" dy="18">reads it but never edits it.</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="schema" data-group-id="wiki-core" data-pad-x="24" data-pad-top="12" data-pad-bottom="12">
    <rect class="ad-node-box stage-box" x="668" y="286" width="368" height="108" rx="18" ry="18"/>
    <rect class="schema-top" x="668" y="286" width="368" height="14" rx="18" ry="18"/>
    <text class="ad-node-title" x="852" y="324" text-anchor="middle">Schema File</text>
    <text class="ad-node-body" x="852" y="342" text-anchor="middle">
      <tspan x="852" dy="0">CLAUDE.md / AGENTS.md sets naming,</tspan>
      <tspan x="852" dy="18">page types, ingest steps,</tspan>
      <tspan x="852" dy="18">and maintenance discipline.</tspan>
    </text>
  </g>

  <g class="ad-group" data-group-id="wiki-shell">
    <rect class="ad-group-box stage-box" x="482" y="408" width="740" height="330" rx="24" ry="24"/>
    <rect class="wiki-top" x="482" y="408" width="740" height="16" rx="24" ry="24"/>
    <text class="ad-node-title" x="852" y="448" text-anchor="middle">wiki/ - Persistent, LLM-Maintained Markdown Layer</text>
    <text class="ad-node-body" x="852" y="474" text-anchor="middle">
      <tspan x="852" dy="0">The agent owns this layer: it writes pages, revises synthesis, maintains links,</tspan>
      <tspan x="852" dy="18">flags contradictions, and keeps the knowledge base current.</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="overview" data-group-id="wiki-shell" data-pad-x="18" data-pad-top="12" data-pad-bottom="10">
    <rect class="ad-node-box stage-box" x="514" y="494" width="196" height="88" rx="16" ry="16"/>
    <rect class="wiki-top" x="514" y="494" width="196" height="12" rx="16" ry="16"/>
    <text class="ad-node-title" x="612" y="528" text-anchor="middle" font-size="16">Overview</text>
    <text class="ad-node-body" x="612" y="551" text-anchor="middle" font-size="12">
      <tspan x="612" dy="0">top-level thesis</tspan>
      <tspan x="612" dy="17">and synthesis</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="concepts" data-group-id="wiki-shell" data-pad-x="18" data-pad-top="12" data-pad-bottom="10">
    <rect class="ad-node-box stage-box" x="754" y="494" width="196" height="88" rx="16" ry="16"/>
    <rect class="wiki-top" x="754" y="494" width="196" height="12" rx="16" ry="16"/>
