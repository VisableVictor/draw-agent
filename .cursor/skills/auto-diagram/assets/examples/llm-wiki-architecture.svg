  <line class="soft-line" x1="552" y1="786" x2="1288" y2="786"/>
  <text class="ad-legend" x="72" y="1020">Reading tip: left to right for the architecture, then bottom row for the operating loop. The core shift vs classic RAG is that knowledge is compiled into a persistent wiki instead of being rediscovered from raw chunks on every query.</text>
</svg>
