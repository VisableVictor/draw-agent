      <tspan x="1054" dy="0">log.md</tspan>
      <tspan x="1054" dy="14">append-only operation timeline</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="human-agent" data-group-id="usage-loop" data-pad-x="20" data-pad-top="12" data-pad-bottom="10">
    <rect class="ad-node-box stage-box" x="1360" y="320" width="368" height="108" rx="18" ry="18"/>
    <rect class="human-top" x="1360" y="320" width="368" height="14" rx="18" ry="18"/>
    <text class="ad-node-title" x="1544" y="354" text-anchor="middle">Human + LLM Pair</text>
    <text class="ad-node-body" x="1544" y="376" text-anchor="middle">
      <tspan x="1544" dy="0">Human curates sources</tspan>
      <tspan x="1544" dy="18">and asks questions.</tspan>
      <tspan x="1544" dy="18">The agent does bookkeeping.</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="obsidian" data-group-id="usage-loop" data-pad-x="20" data-pad-top="12" data-pad-bottom="10">
    <rect class="ad-node-box stage-box" x="1360" y="462" width="368" height="108" rx="18" ry="18"/>
    <rect class="tool-top" x="1360" y="462" width="368" height="14" rx="18" ry="18"/>
    <text class="ad-node-title" x="1544" y="496" text-anchor="middle">Obsidian Frontend</text>
    <text class="ad-node-body" x="1544" y="518" text-anchor="middle">
      <tspan x="1544" dy="0">Browse graph view,</tspan>
      <tspan x="1544" dy="18">backlinks, and pages</tspan>
      <tspan x="1544" dy="18">like a knowledge IDE.</tspan>
    </text>
  </g>

