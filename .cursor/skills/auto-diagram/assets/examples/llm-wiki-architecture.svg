    <rect class="tool-top" x="1360" y="732" width="368" height="14" rx="18" ry="18"/>
    <text class="ad-node-title" x="1544" y="766" text-anchor="middle">Outputs That Can Feed Back</text>
    <text class="ad-node-body" x="1544" y="790" text-anchor="middle">
      <tspan x="1544" dy="0">answers, comparison tables,</tspan>
      <tspan x="1544" dy="18">slides, charts, or</tspan>
      <tspan x="1544" dy="18">new pages from valuable analysis</tspan>
    </text>
  </g>

