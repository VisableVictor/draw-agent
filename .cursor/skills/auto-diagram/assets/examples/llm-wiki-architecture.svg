    <text class="ad-node-body" x="972" y="665" text-anchor="middle" font-size="12">
      <tspan x="972" dy="0">trade-offs, diffs,</tspan>
      <tspan x="972" dy="17">decision views</tspan>
    </text>
  </g>

  <g>
