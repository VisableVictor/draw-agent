      <tspan x="650" dy="14">catalog for navigation</tspan>
    </text>
  </g>

  <g>
    <rect class="stage-box" x="944" y="704" width="220" height="28" rx="12" ry="12"/>
    <rect class="index-top" x="944" y="704" width="220" height="8" rx="12" ry="12"/>
