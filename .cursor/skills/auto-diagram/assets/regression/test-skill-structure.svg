  <text class="ad-legend" x="84" y="886">Legend: solid arrows show the main production flow; dashed arrows show optional constraints or export branches.</text>

  <g class="ad-node" data-node-id="chip-brainstorm" data-stage-id="main-stage" data-role="support" data-pad-x="18" data-pad-top="8" data-pad-bottom="8">
    <rect class="ad-node-box stage-box" x="468" y="892" width="246" height="46" rx="11.985" ry="12.196"/>
    <rect class="quality-top" x="468" y="892" width="246" height="8" rx="12" ry="12"/>
    <text class="ad-node-body" x="591" y="913" text-anchor="middle" font-size="11">
      <tspan x="591" dy="0">Step 1: lock audience and story</tspan>
      <tspan x="591" dy="14">before drawing anything</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="chip-render" data-stage-id="main-stage" data-role="support" data-pad-x="18" data-pad-top="8" data-pad-bottom="8">
    <rect class="ad-node-box stage-box" x="796" y="892" width="246" height="46" rx="11.898" ry="11.503"/>
    <rect class="render-top" x="796" y="892" width="246" height="8" rx="12" ry="12"/>
    <text class="ad-node-body" x="919" y="913" text-anchor="middle" font-size="11">
      <tspan x="919" dy="0">Step 2: route to the right backend</tspan>
      <tspan x="919" dy="14">and render the master output</tspan>
    </text>
  </g>

  <g class="ad-node" data-node-id="chip-deliver" data-stage-id="main-stage" data-role="support" data-pad-x="18" data-pad-top="8" data-pad-bottom="8">
    <rect class="ad-node-box stage-box" x="1124" y="892" width="246" height="46" rx="12.523" ry="12.317"/>
    <rect class="output-top" x="1124" y="892" width="246" height="8" rx="12" ry="12"/>
    <text class="ad-node-body" x="1247" y="913" text-anchor="middle" font-size="11">
      <tspan x="1247" dy="0">Step 3: pass quality gates</tspan>
      <tspan x="1247" dy="14">before any final delivery</tspan>
    </text>
  </g><metadata id="x-0bbf840c9616">v=8;s=c617cdc4b9f596fe19;c=4ea033f338284bab;l=c2d117cbe087;t=6e137bba7e</metadata></svg>
