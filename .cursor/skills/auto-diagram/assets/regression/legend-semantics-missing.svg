<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="500" fill="#101828"/>
  <text class="ad-title" x="64" y="72" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="30" font-weight="700" fill="#f8fbff">多通道边语义缺失图例</text>
  <text class="ad-subtitle" x="64" y="102" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="15" font-weight="500" fill="#b8c6d5">这个反例专门用来验证：当边语义已经分层时，如果没有 legend，应该至少收到 warning。</text>

  <g class="ad-stage" data-stage-id="main-stage">
    <rect class="ad-stage-box" x="48" y="150" width="804" height="276" rx="22" ry="22" fill="#162033" stroke="#3f5e87" stroke-width="2"/>
  </g>

  <g class="ad-node" data-node-id="source" data-stage-id="main-stage" data-role="secondary" data-flow-level="core" data-pad-x="24" data-pad-top="18" data-pad-bottom="18">
    <rect class="ad-node-box" x="96" y="234" width="180" height="96" rx="16" ry="16" fill="#1c3153" stroke="#78a8ff" stroke-width="2"/>
    <text class="ad-node-title" x="186" y="274" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" font-weight="700" fill="#f4f8ff">需求输入</text>
    <text class="ad-node-body" x="186" y="300" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#d6e0ef">订单与承诺</text>
  </g>

  <g class="ad-node" data-node-id="control" data-stage-id="main-stage" data-role="primary" data-flow-level="core" data-pad-x="24" data-pad-top="18" data-pad-bottom="18">
    <rect class="ad-node-box" x="362" y="234" width="180" height="96" rx="16" ry="16" fill="#1a3949" stroke="#39d0ff" stroke-width="2"/>
    <text class="ad-node-title" x="452" y="274" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" font-weight="700" fill="#eefcff">编排中枢</text>
    <text class="ad-node-body" x="452" y="300" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#d6e0ef">主链、控制、反馈</text>
  </g>

  <g class="ad-node" data-node-id="delivery" data-stage-id="main-stage" data-role="secondary" data-flow-level="core" data-pad-x="24" data-pad-top="18" data-pad-bottom="18">
    <rect class="ad-node-box" x="628" y="234" width="180" height="96" rx="16" ry="16" fill="#28381f" stroke="#9de541" stroke-width="2"/>
    <text class="ad-node-title" x="718" y="274" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="22" font-weight="700" fill="#f4ffe8">履约执行</text>
    <text class="ad-node-body" x="718" y="300" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#d6e0ef">仓配与签收</text>
  </g>

  <path class="ad-edge" data-edge-channel="primary" d="M276 282 H362" stroke="#8fbfff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path class="ad-edge" data-edge-channel="feedback" d="M628 304 H542" stroke="#39d0ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path class="ad-edge" data-edge-channel="control" d="M452 330 V378" stroke="#ffad5c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path class="ad-edge" data-edge-channel="exception" d="M718 234 V184 H452" stroke="#ff5d7d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
