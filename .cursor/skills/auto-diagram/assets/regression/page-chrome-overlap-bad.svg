<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#0b1323"/>

  <text class="ad-title" x="72" y="78" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="34" font-weight="700" fill="#f5f7fb">物流履约调度总览</text>
  <text class="ad-subtitle" x="72" y="110" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="16" font-weight="500" fill="#b6c2d0">这个反例故意把 header、footer 和 legend 语义全部做坏。</text>

  <g class="ad-node" data-node-id="summary-card" data-role="annotation" data-pad-x="24" data-pad-top="18" data-pad-bottom="18">
    <rect class="ad-note-box" x="410" y="42" width="520" height="108" rx="18" ry="18" fill="#2b1e17" stroke="#ff9350" stroke-width="1.8"/>
    <text class="ad-note-title" x="670" y="82" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="700" fill="#fff4e8">坏例子：这张卡故意压进标题区</text>
    <text class="ad-note-body" x="670" y="110" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#ffe1c4">一旦进了标题区，现在的新闸门必须直接报错。</text>
  </g>

  <g class="ad-stage" data-stage-id="main-stage">
    <rect class="ad-stage-box" x="52" y="96" width="1096" height="520" rx="26" ry="26" fill="#101b31" stroke="#314c73" stroke-width="2"/>
  </g>

  <g class="ad-node" data-node-id="left" data-stage-id="main-stage" data-role="secondary" data-flow-level="core" data-pad-x="24" data-pad-top="18" data-pad-bottom="18">
    <rect class="ad-node-box" x="90" y="232" width="230" height="120" rx="16" ry="16" fill="#1a2f51" stroke="#6ea8ff" stroke-width="2"/>
    <text class="ad-node-title" x="205" y="280" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="24" font-weight="700" fill="#f6f9ff">订单接入</text>
    <text class="ad-node-body" x="205" y="310" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#d7e1f0">主数据、库存、地址校验</text>
  </g>

  <g class="ad-node" data-node-id="middle" data-stage-id="main-stage" data-role="primary" data-flow-level="core" data-pad-x="24" data-pad-top="18" data-pad-bottom="18">
    <rect class="ad-node-box" x="470" y="232" width="260" height="120" rx="16" ry="16" fill="#183649" stroke="#39d0ff" stroke-width="2"/>
    <text class="ad-node-title" x="600" y="280" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="24" font-weight="700" fill="#effcff">调度控制塔</text>
    <text class="ad-node-body" x="600" y="310" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="14" font-weight="500" fill="#d7e1f0">路线、承运商、波次统一编排</text>
  </g>

  <g class="ad-node" data-node-id="bottom-note" data-role="annotation" data-stage-id="main-stage" data-pad-x="24" data-pad-top="18" data-pad-bottom="18">
    <rect class="ad-note-box" x="110" y="626" width="980" height="70" rx="16" ry="16" fill="#2f2117" stroke="#ffad5c" stroke-width="1.6"/>
    <text class="ad-note-title" x="600" y="656" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="18" font-weight="700" fill="#fff4e8">坏例子：这张卡故意压住 footer legend</text>
    <text class="ad-note-body" x="600" y="680" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="13" font-weight="500" fill="#ffe1c4">如果页脚图例被说明卡吃掉，新的 page chrome 检查必须报错。</text>
  </g>

  <path class="ad-edge" data-edge-channel="feedback" d="M90 88 H920" stroke="#39d0ff" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path class="ad-edge" data-edge-channel="control" d="M320 292 H470" stroke="#ffad5c" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path class="ad-edge" data-edge-channel="exception" d="M730 292 H940" stroke="#ff5d7d" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <text class="ad-edge-label" x="500" y="82" text-anchor="middle" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="12" font-weight="600" fill="#dbe6f3">这条边故意穿过标题区</text>
  <text class="ad-legend" x="72" y="672" font-family="PingFang SC, Helvetica Neue, sans-serif" font-size="12" font-weight="500" fill="#b6c2d0">这个 footer legend 也被故意压住了，而且图里多种边通道没有被正确解释。</text>
</svg>
