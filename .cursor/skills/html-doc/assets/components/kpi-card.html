<!-- KPI Card Component -->
<!-- 使用场景：展示关键数字指标，多个卡片用 grid 排列 -->
<!-- 布局示例：<div class="grid grid-cols-1 md:grid-cols-3 gap-6"> -->
<div class="bg-white rounded-lg shadow p-6 hover:shadow-md transition">
    <div class="text-sm text-gray-500 mb-2">{{指标名称}}</div>
    <div class="text-3xl font-bold text-primary">{{数值}}</div>
    <div class="text-sm mt-2 {{变化率颜色}}">
        {{变化方向}} {{变化率}}% 环比
    </div>
</div>
