<!-- Data Table Component -->
<!-- 使用场景：结构化数据展示，带表头高亮、斑马纹、悬停效果 -->
<div class="bg-white rounded-lg shadow overflow-hidden">
    <div class="px-6 py-4 border-b">
        <h3 class="text-lg font-semibold">{{表格标题}}</h3>
    </div>
    <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{列名 1}}</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{列名 2}}</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">{{列名 3}}</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 text-sm">{{数据 1}}</td>
                    <td class="px-6 py-4 text-sm">{{数据 2}}</td>
                    <td class="px-6 py-4 text-sm">{{数据 3}}</td>
                </tr>
                <tr class="hover:bg-gray-50 transition">
                    <td class="px-6 py-4 text-sm">{{数据 1}}</td>
                    <td class="px-6 py-4 text-sm">{{数据 2}}</td>
                    <td class="px-6 py-4 text-sm">{{数据 3}}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
