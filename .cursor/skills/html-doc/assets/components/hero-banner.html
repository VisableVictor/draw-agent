<!-- Hero Banner Component -->
<!-- 使用场景：报告顶部标题区域，展示标题、副标题、作者和日期 -->
<header class="bg-white border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">{{报告主标题}}</h1>
        <p class="text-xl text-gray-600 mb-2">{{报告副标题或摘要}}</p>
        <div class="text-sm text-gray-500">
            <span>作者：{{作者}}</span> · <span>日期：{{日期}}</span>
        </div>
    </div>
</header>
